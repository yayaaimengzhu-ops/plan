          '<div class="seg-head">' +
            ed('span', 'seg-title', si, k + '.title', g.title, '环节名称', '第' + n + '段 环节名称') +
            '<span class="seg-tools">' +
              btn('seg-up', si, k, '↑', 'tool', '上移这一段') +
              btn('seg-down', si, k, '↓', 'tool', '下移这一段') +
              btn('seg-del', si, k, '删除', 'tool del', '删除这一段') +
            '</span>' +
          '</div>' +
          listHTML(si, k + '.pts', g.points, '写一个要点', '加要点', '要点') +
        '</div>' +
      '</li>';
    }).join('');
    return '<article class="session" id="' + esc(s.id) + '">' +
      '<div class="s-head">' +
        '<span class="s-date">' + esc(s.date) + '</span><span class="s-dow">周三</span>' +
        '<span class="chip p-' + esc(s.pillar) + '">' + esc(PILLARS[s.pillar] || s.pillar) + '</span>' +
        '<span class="s-no">第 ' + esc(s.no) + ' 期</span>' +
        '<span class="s-dur">' + esc(s.duration || '60 分钟') + '</span>' +
        btn('copy-session', si, null, '复制本期', 'btn ghost small') +
      '</div>' +
      ed('h2', 's-title', si, 'title', s.title, '这一期的主题', '第' + s.no + '期 主题') +
      '<div class="oneliner"><span class="label">本课一句话</span>' +
        ed('p', 's-line', si, 'oneLiner', s.oneLiner, '这节课最想讲的一句话', '本课一句话') + '</div>' +
      '<div class="meta">' +
        '<section class="block"><h3>为什么现在讲</h3>' + listHTML(si, 'why', s.why, '写一个理由', '加一条', '理由') + '</section>' +
        '<section class="block"><h3>本课交付物</h3>' + listHTML(si, 'deliverables', s.deliverables, '写一个交付物', '加一条', '交付物') + '</section>' +
      '</div>' +
      '<h3 class="outline-h">大纲<span class="hint">共 ' + s.segments.length + ' 段</span></h3>' +
      '<ol class="timeline">' + segs + '</ol>' +
      btn('add-seg', si, null, '＋ 加一段', 'add') +
      '<div class="meta">' +
        '<section class="block"><h3>作业</h3>' + listHTML(si, 'homework', s.homework, '写一条作业', '加一条', '作业') + '</section>' +
        '<section class="block"><h3>红线提醒</h3>' + listHTML(si, 'redlines', s.redlines, '写一条红线', '加一条', '红线') + '</section>' +
      '</div>' +
      '<section class="notes"><h3>我的修改意见</h3>' +
        ed('div', 'note', si, 'notes', s.notes, '写下想改的地方，或者给 Claude 的说明，例如：这一段做成 2 页 PPT', '我的修改意见', true) +
      '</section>' +
    '</article>';
  }
  function renderSessions() {
    document.getElementById('sessions').innerHTML = state.sessions.map(function (_, i) { return sessionHTML(i); }).join('');
  }
  function shellHTML() {
    var nav = state.sessions.map(function (s) {
      return '<a class="jump-link" href="#' + esc(s.id) + '"><span class="jd">' + esc(s.date) + '</span>' +
        '<span class="chip p-' + esc(s.pillar) + '">' + esc(PILLARS[s.pillar] || s.pillar) + '</span></a>';
    }).join('');
    return '<header class="wrap masthead">' +
        '<h1>' + esc(state.title || PAGE_TITLE) + '</h1>' +
        '<span class="range">' + esc(state.range || '') + '</span>' +
        '<p class="howto">点任意文字就能改。要点里按回车加一条，清空后再按退格删掉；每段右侧可以上移、下移、删除。改完点「保存修改」，再回到对话里说一声“改好了”，我按新版本做 PPT。</p>' +
      '</header>' +
      '<nav class="jump" aria-label="跳到某一期"><div class="wrap jump-in">' + nav + '</div></nav>' +
      '<div class="wrap content">' +
        '<div class="banner" id="banner" hidden></div>' +
        '<div id="sessions"></div>' +
        '<footer class="foot" id="foot"></footer>' +
      '</div>' +
      '<div class="actionbar"><div class="wrap actionbar-in">' +
        '<span class="status" id="status" role="status" aria-live="polite"></span>' +
        btn('copy-all', null, null, '复制全部大纲', 'btn') +
        btn('save', null, null, '保存修改', 'btn primary') +
      '</div></div>' +
      '<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>' +
      '<div class="panel" id="copy-panel" hidden>' +
        '<div class="panel-in" role="dialog" aria-modal="true" aria-label="手动复制">' +
          '<p>浏览器不允许自动复制。下面的文字已经全选，请手动复制：电脑按 Ctrl+C 或 ⌘C，手机长按后选“复制”。</p>' +
          '<textarea id="copy-area" readonly></textarea>' +
          btn('close-panel', null, null, '关闭', 'btn') +
        '</div>' +
      '</div>';
  }
  function renderFoot() {
    var f = document.getElementById('foot');
    if (!f) return;
    var t = state.savedAt ? ' · 保存于 ' + fmtTime(Date.parse(state.savedAt)) : '';
    f.textContent = '依据仓库「课程规划/04-教案」的完整教案压缩而成 · 第 ' + (state.rev || 1) + ' 版' + t;
  }

  /* ---------- 状态与提示 ---------- */
  function setStatus(text, tone) {
    var el = document.getElementById('status');
    if (!el) return;
    el.textContent = text;
    el.setAttribute('data-tone', tone || '');
  }
  function refreshUI() {
    var saveBtn = app.querySelector('[data-act="save"]');
    if (saveBtn) {
      saveBtn.hidden = !(mode === 'ready' || mode === 'connecting');
      saveBtn.disabled = mode !== 'ready' || !dirty || saving;
    }
    if (saving) { setStatus('正在保存…'); return; }
    if (mode === 'connecting') { setStatus(dirty ? '有未保存的修改' : '连接中…', dirty ? 'warn' : ''); return; }
    if (mode === 'offline') { setStatus('离线文件，不能直接保存', dirty ? 'warn' : ''); return; }
    if (mode === 'nosave') { setStatus('这里不能直接保存', dirty ? 'warn' : ''); return; }
    if (mode === 'readonly') { setStatus('只能查看，不能保存', 'warn'); return; }
    setStatus(dirty ? '有未保存的修改' : '已保存', dirty ? 'warn' : 'ok');
  }
  function showBanner(html) {
    var b = document.getElementById('banner');
    b.innerHTML = html;
    b.hidden = false;
  }
  function hideBanner() {
    var b = document.getElementById('banner');
    b.hidden = true;
    b.innerHTML = '';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function setMode(m) {
    mode = m;
    refreshUI();
    var notice = {
      offline: '这是离线打开的文件：可以修改和复制，但不能直接保存。改完请点「复制全部大纲」，粘贴发给 Claude。',
      nosave: '这个页面现在不能直接保存（可能是只读查看，或者不在 claude.ai 里打开）。改完请点「复制全部大纲」，粘贴发给 Claude。',
      readonly: '你对这个页面只有查看权限，保存不了。改完请点「复制全部大纲」，粘贴发给 Claude。'
    }[m];
    var b = document.getElementById('banner');
    if (notice && b && b.hidden) showBanner('<span>' + esc(notice) + '</span>');
  }

  /* ---------- 草稿 ---------- */
  function writeDraft() {
    try {
      if (dirty) localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: Date.now(), sessions: state.sessions }));
      else localStorage.removeItem(DRAFT_KEY);
    } catch (_) {}
  }
  function scheduleDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(writeDraft, 500);
  }
  function checkDraft() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (_) { d = null; }
    if (!d || !Array.isArray(d.sessions)) return;
    if (JSON.stringify(d.sessions) === savedKey) {
      try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
      return;
    }
    pendingDraft = d;
    showBanner('<span>上次有一份没保存的修改（' + esc(fmtTime(d.at)) + '）。</span>' +
      btn('restore-draft', null, null, '恢复这份修改', 'btn small') +
      btn('discard-draft', null, null, '不要了', 'btn ghost small'));
  }
  function changed() {
    dirty = contentKey(state) !== savedKey;
    refreshUI();
    scheduleDraft();
  }

  /* ---------- 数据定位 ---------- */
  function getRef(si, key) {
    var s = state.sessions[si];
    var p = key.split('.');
    if (p[0] === 'seg') {
      var seg = s.segments[+p[1]];
      if (p[2] === 'pts') return p.length === 4 ? { arr: seg.points, idx: +p[3] } : { arr: seg.points };
      return { obj: seg, prop: p[2] };
    }
    if (LISTS.indexOf(p[0]) >= 0) return p.length === 2 ? { arr: s[p[0]], idx: +p[1] } : { arr: s[p[0]] };
    return { obj: s, prop: p[0] };
  }
  function parentKey(key) { return key.split('.').slice(0, -1).join('.'); }
  function setValue(si, key, text) {
    var r = getRef(si, key);
    if (r.arr && typeof r.idx === 'number') r.arr[r.idx] = text;
    else if (r.obj) r.obj[r.prop] = text;
  }
  function focusEnd(si, key) {
    var el = app.querySelector('[contenteditable][data-s="' + si + '"][data-k="' + key + '"]');
    if (!el) return;
    el.focus();
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      r.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (_) {}
  }
  function rerender(si, focusKey) {
    var old = document.getElementById(state.sessions[si].id);
    var holder = document.createElement('div');
    holder.innerHTML = sessionHTML(si);
    old.replaceWith(holder.firstElementChild);
    if (focusKey) focusEnd(si, focusKey);
  }

  /* ---------- 复制 ---------- */
  function addList(lines, heading, items) {
    var xs = items.filter(function (t) { return t && t.trim(); });
    if (!xs.length) return;
    lines.push('', '**' + heading + '**');
    xs.forEach(function (t) { lines.push('- ' + t.trim()); });
  }
  function sessionMarkdown(si) {
    var s = state.sessions[si];
    var L = ['## 第 ' + s.no + ' 期 · ' + s.date + '（周三，' + (s.duration || '60 分钟') + '）· ' + (PILLARS[s.pillar] || s.pillar), '', '### ' + s.title];
    if (s.oneLiner.trim()) L.push('', '> ' + s.oneLiner.trim());
    addList(L, '为什么现在讲', s.why);
    addList(L, '本课交付物', s.deliverables);
    L.push('', '**大纲**');
    s.segments.forEach(function (g, j) {
      L.push((j + 1) + '. ' + (g.time.trim() ? g.time.trim() + '｜' : '') + g.title.trim());
      g.points.forEach(function (p) { if (p && p.trim()) L.push('   - ' + p.trim()); });
    });
    addList(L, '作业', s.homework);
    addList(L, '红线提醒', s.redlines);
    if (s.notes.trim()) L.push('', '**我的修改意见**', s.notes.trim());
    return L.join('\n');
  }
  function allMarkdown() {
    return '# ' + (state.title || PAGE_TITLE) + '（' + (state.range || '') + '）\n\n' +
      state.sessions.map(function (_, i) { return sessionMarkdown(i); }).join('\n\n---\n\n') + '\n';
  }
  function showCopyPanel(text) {
    var p = document.getElementById('copy-panel');
    var a = document.getElementById('copy-area');
    a.value = text;
    p.hidden = false;
    a.focus();
    a.select();
  }
  function copyText(text, what) {
    try {
      navigator.clipboard.writeText(text).then(function () {
        toast('已复制' + what + '，可以直接粘贴');
      }, function () { showCopyPanel(text); });
    } catch (_) { showCopyPanel(text); }
  }

  /* ---------- 保存 ---------- */
  function buildDocument(next) {
    var style = document.getElementById('app-style').textContent;
    var script = document.getElementById('app-script').textContent;
    return SHELL_OPEN +
      '<title>' + esc(PAGE_TITLE) + '</title>\n' +
      '<style id="app-style">' + style + '</style>\n' +
      FONT_LINK + '\n' +
      '<main id="app"></main>\n' +
      '<script type="application/json" id="outline-data">\n' + jsonForScript(next) + '\n</' + 'script>\n' +
      '<script id="app-script">' + script + '</' + 'script>\n' +
      SHELL_CLOSE;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function publish(html) {
    return art.publish(html).catch(function (err) {
      if (err && err.code === 'upstream_error') {
        return sleep(800 + Math.random() * 1200).then(function () { return art.publish(html); });
      }
      throw err;
    });
  }
  function save() {
    if (!art || mode !== 'ready' || !dirty || saving) return;
    saving = true;
    refreshUI();
    clearTimeout(draftTimer);
    writeDraft();
    var next = {
      title: state.title || PAGE_TITLE,
      range: state.range || '',
      rev: (state.rev || 1) + 1,
      savedAt: new Date().toISOString(),
      sessions: state.sessions
    };
    publish(buildDocument(next)).then(function () {
      saving = false;
      setStatus('已保存，正在刷新到新版本…', 'ok');
    }, function (err) {
      saving = false;
      var code = err && err.code;
      if (code === 'conflict') {
        showBanner('<span>有一个更新的版本先保存了，页面会自动刷新。你刚才的修改已经暂存，刷新后可以恢复。</span>');
        refreshUI();
        return;
      }
      if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) >= 0) {
        hideBanner();
        setMode('readonly');
        return;
      }
      if (code === 'rate_limited') {
        refreshUI();
        toast('保存太频繁了，过一会儿再点保存');
        return;
      }
      refreshUI();
      showBanner('<span>保存没成功（' + esc(code || '未知原因') + '）。可以先点「复制全部大纲」，把内容发给 Claude。</span>');
    });
  }
  function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setMode('offline'); return; }
    setMode('connecting');
    window.claude.use('artifact').then(function (ns) {
      if (!ns) { setMode('nosave'); return; }
      art = ns;
      setMode('ready');
    }, function () { setMode('nosave'); });
  }

  /* ---------- 事件 ---------- */
  function editableFrom(target) {
    return target && target.closest ? target.closest('[contenteditable][data-k]') : null;
  }
  function onInput(e) {
    var el = editableFrom(e.target);
    if (!el) return;
    var multiline = el.hasAttribute('data-ml');
    var text = multiline ? el.innerText.replace(/\n$/, '') : el.textContent.replace(/\s*\n\s*/g, ' ');
    if (!text.trim() && !el.textContent) el.innerHTML = '';
    if (text === '' && el.innerHTML !== '') el.innerHTML = '';
    setValue(+el.getAttribute('data-s'), el.getAttribute('data-k'), text);
    changed();
  }
  function onKeydown(e) {
    var el = editableFrom(e.target);
    if (!el) return;
    if (e.isComposing || e.keyCode === 229) return;
    var si = +el.getAttribute('data-s');
    var key = el.getAttribute('data-k');
    var r = getRef(si, key);
    var isItem = r.arr && typeof r.idx === 'number';
    if (e.key === 'Enter' && !e.shiftKey) {
      if (el.hasAttribute('data-ml')) return;
      e.preventDefault();
      if (isItem) {
        r.arr.splice(r.idx + 1, 0, '');
        rerender(si, parentKey(key) + '.' + (r.idx + 1));
        changed();
      } else {
        el.blur();
      }
    } else if (e.key === 'Backspace' && isItem && el.textContent === '') {
      e.preventDefault();
      r.arr.splice(r.idx, 1);
      rerender(si, r.idx > 0 ? parentKey(key) + '.' + (r.idx - 1) : null);
      changed();
    } else if (e.key === 'Escape') {
      el.blur();
    }
  }
  function onPaste(e) {
    var el = editableFrom(e.target);
    if (!el) return;
    var multiline = el.hasAttribute('data-ml');
    if (multiline && CE === 'plaintext-only') return;
    e.preventDefault();
    var data = e.clipboardData || window.clipboardData;
    var t = data ? data.getData('text/plain') || data.getData('Text') || '' : '';
    if (!multiline) t = t.replace(/\s*\n\s*/g, ' ');
    var done = false;
    try { done = document.execCommand && document.execCommand('insertText', false, t); } catch (_) { done = false; }
    if (!done) {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      var range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(document.createTextNode(t));
      range.collapse(false);
      onInput({ target: el });
    }
  }
  function onClick(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    var si = b.hasAttribute('data-s') ? +b.getAttribute('data-s') : null;
    var key = b.getAttribute('data-k');
    var r, segs, j, t, tmp;
    switch (act) {
      case 'add-item':
        r = getRef(si, key);
        r.arr.push('');
        rerender(si, key + '.' + (r.arr.length - 1));
        changed();
        break;
      case 'del-item':
        r = getRef(si, key);
        r.arr.splice(r.idx, 1);
        rerender(si);
        changed();
        break;
      case 'seg-up':
      case 'seg-down':
        segs = state.sessions[si].segments;
        j = +key.split('.')[1];
        t = act === 'seg-up' ? j - 1 : j + 1;
        if (t < 0 || t >= segs.length) return;
        tmp = segs[j]; segs[j] = segs[t]; segs[t] = tmp;
        rerender(si);
        changed();
        var nb = app.querySelector('[data-act="' + act + '"][data-s="' + si + '"][data-k="seg.' + t + '"]');
        if (nb) nb.focus();
        break;
      case 'seg-del':
        if (b.getAttribute('data-armed') !== '1') {
          b.setAttribute('data-armed', '1');
          b.textContent = '再点一次删除';
          setTimeout(function () {
            if (b.isConnected) { b.setAttribute('data-armed', ''); b.textContent = '删除'; }
          }, 3000);
          return;
        }
        state.sessions[si].segments.splice(+key.split('.')[1], 1);
        rerender(si);
        changed();
        break;
      case 'add-seg':
        segs = state.sessions[si].segments;
        segs.push({ time: '', title: '', points: [''] });
        rerender(si, 'seg.' + (segs.length - 1) + '.time');
        changed();
        break;
      case 'copy-session':
        copyText(sessionMarkdown(si), '本期大纲');
        break;
      case 'copy-all':
        copyText(allMarkdown(), '全部大纲');
        break;
      case 'save':
        save();
        break;
      case 'restore-draft':
        if (pendingDraft) {
          state.sessions = pendingDraft.sessions;
          state.sessions.forEach(normalize);
          pendingDraft = null;
          hideBanner();
          renderSessions();
          changed();
          toast('已恢复上次的修改');
        }
        break;
      case 'discard-draft':
        pendingDraft = null;
        try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
        hideBanner();
        break;
      case 'close-panel':
        document.getElementById('copy-panel').hidden = true;
        break;
    }
  }

  if (load()) {
    app.innerHTML = shellHTML();
    renderSessions();
    renderFoot();
    app.addEventListener('input', onInput);
    app.addEventListener('keydown', onKeydown);
    app.addEventListener('paste', onPaste);
    app.addEventListener('click', onClick);
    checkDraft();
    refreshUI();
    connect();
  }
})();
</script>

</body></html>
